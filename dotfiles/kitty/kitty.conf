# kitty — terminal for the tiling sessions (niri Mod+T, qtile Mod+Return).
# Deployed by hjem to ~/.config/kitty/kitty.conf. Reference: man kitty.conf
# Reload a running kitty: Ctrl+Shift+F5.

# Obel Mono (pkgs/obel-mono); ss01 = secret masking. Nerd Font symbols
# still come from JetBrainsMono via kitty's symbol fallback.
font_family      family="Obel Mono" features="+ss01"
symbol_map       U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font
font_size        11.0
disable_ligatures cursor

background_opacity 0.92
window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
scrollback_lines 10000

# Tabs (Ctrl+Shift+T new, Ctrl+Shift+Left/Right switch).
tab_bar_edge top
tab_bar_style powerline

# Wallpaper palette (generated by matugen, `wallpaper`): UI colours only.
include colors.conf
