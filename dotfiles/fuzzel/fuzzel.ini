# fuzzel — app launcher (Mod+D) and dmenu for the clipboard picker
# (Mod+Shift+C) in the Niri session. Deployed by hjem to
# ~/.config/fuzzel/fuzzel.ini. Reference: man fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=12
# Same icon theme as the GTK/KDE settings (installed with Plasma).
icon-theme=oxygen
terminal=konsole -e
lines=12
width=40

[colors]
# Matches waybar / niri's default focus ring (#7fc8ff).
background=18181bf0
text=e4e4e7ff
match=7fc8ffff
selection=7fc8ffff
selection-text=18181bff
selection-match=18181bff
border=7fc8ffff

[border]
width=2
radius=8
