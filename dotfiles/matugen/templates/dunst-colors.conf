# Generated by matugen from the current wallpaper (`wallpaper`, nix-dots
# dotfiles/matugen/templates/dunst-colors.conf). dunst drop-in (dunstrc.d).
[urgency_low]
    background = "#{{colors.surface.default.hex_stripped}}f0"
    foreground = "{{colors.on_surface_variant.default.hex}}"
    frame_color = "{{colors.outline_variant.default.hex}}"

[urgency_normal]
    background = "#{{colors.surface.default.hex_stripped}}f0"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{colors.primary.default.hex}}"

[urgency_critical]
    background = "#{{colors.surface.default.hex_stripped}}f0"
    foreground = "{{colors.on_surface.default.hex}}"
    frame_color = "{{colors.error.default.hex}}"
