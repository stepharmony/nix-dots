# Generated by matugen from the current wallpaper (`wallpaper`, nix-dots
# dotfiles/matugen/templates/helix-theme.toml). The theme "matugen" in
# dotfiles/helix/config.toml. Tokyonight's scopes (and italics) stay; the UI
# part of its palette and the keyword/function/type hues follow the
# wallpaper, while strings, constants, parameters and errors keep their
# fixed hues for contrast.
inherits = "tokyonight"

# No bg: kitty's background (the same surface colour) shows through, so
# background_opacity still applies inside helix.
"ui.background" = { fg = "fg" }
"ui.linenr.selected" = { fg = "{{colors.primary.default.hex}}" }
"ui.statusline.normal" = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}", modifiers = ["bold"] }
"ui.statusline.insert" = { bg = "{{colors.tertiary.default.hex}}", fg = "{{colors.on_tertiary.default.hex}}", modifiers = ["bold"] }
"ui.statusline.select" = { bg = "{{colors.secondary.default.hex}}", fg = "{{colors.on_secondary.default.hex}}", modifiers = ["bold"] }

# Merged over tokyonight's palette.
[palette]
purple = "{{colors.primary.default.hex}}" # keywords
magenta = "{{colors.primary.default.hex}}" # control flow, operators
blue = "{{colors.secondary.default.hex}}" # functions
aqua = "{{colors.tertiary.default.hex}}" # types, builtins
comment = "{{colors.outline.default.hex}}"
fg = "{{colors.on_surface.default.hex}}"
fg-dark = "{{colors.on_surface_variant.default.hex}}"
fg-gutter = "{{colors.outline_variant.default.hex}}"
fg-linenr = "{{colors.outline.default.hex}}"
fg-selected = "{{colors.surface_container_highest.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"
border-highlight = "{{colors.primary.default.hex}}"
bg = "{{colors.surface.default.hex}}"
bg-inlay = "{{colors.surface_container_low.default.hex}}"
bg-selection = "{{colors.primary_container.default.hex}}"
bg-menu = "{{colors.surface_container.default.hex}}"
bg-focus = "{{colors.surface_container_high.default.hex}}"
